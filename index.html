<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>وحوش الرياضيات – الصف السادس</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6ff;--card:#fff;--ink:#1b2340;--mut:#5d668a;--pri:#3b4cca;--acc:#ffc93c;--ok:#1f9d6b;--bad:#d64550;--ln:#dfe4f7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12172b;--card:#1c2340;--ink:#eef1ff;--mut:#a5aed6;--pri:#8e9bff;--ln:#2d3760}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;line-height:1.7}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--pri);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.big.num{font-size:min(1.7rem,7vw);white-space:nowrap}.sp{display:inline-block;width:.5em}.logo{cursor:pointer;width:40px;height:40px;border-radius:50%;border:2px solid #ffc93c;vertical-align:middle;background:#fff}header h1{display:flex;align-items:center;gap:8px;font-size:1.05rem;margin:0}.pts{background:var(--acc);color:#1b2340;border-radius:20px;padding:2px 14px;font-weight:900}
main{max-width:760px;margin:0 auto;padding:14px 14px 90px}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;padding:10px;font-weight:700}nav button.on{color:var(--pri)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.les{cursor:pointer;text-align:right;font:inherit;color:var(--ink);display:block;width:100%}.les b{font-size:1.05rem}.les small{display:block;color:var(--mut)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:9px 18px;font:inherit;font-weight:700;cursor:pointer;margin:4px 0}.btn.g{background:var(--ok)}.btn.s{background:none;color:var(--pri);border:2px solid var(--pri)}
.tabs{display:flex;gap:6px}.tabs .btn{flex:1}.tabs .btn:not(.on){background:none;color:var(--pri);border:2px solid var(--pri)}
.opt{display:block;width:100%;text-align:right;background:var(--card);color:var(--ink);border:2px solid var(--ln);border-radius:12px;padding:10px;margin:6px 0;font:inherit;font-size:1.05rem;cursor:pointer}
.opt.ok{border-color:var(--ok);background:#1f9d6b30}.opt.no{border-color:var(--bad);background:#d6455030}
.fb{padding:8px 12px;border-radius:10px;margin:8px 0;font-weight:700}.fb.ok{background:#1f9d6b30}.fb.no{background:#d6455030}
.bar{height:10px;background:var(--ln);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
input,select{font:inherit;padding:8px;border:2px solid var(--ln);border-radius:10px;background:var(--card);color:var(--ink);width:100%;margin:4px 0}input[type=range]{padding:0}
.f{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.2}.f b{border-bottom:2px solid currentColor;padding:0 4px;font-weight:700}.f i{font-style:normal}
.cols{display:flex;gap:4px;direction:rtl}.col{flex:1;text-align:center;background:var(--bg);border-radius:10px;padding:4px}.col small{display:block;font-size:.65rem;color:var(--mut)}.col b{font-size:1.1rem}
.res{font-size:1.2rem;font-weight:900;color:var(--pri)}u{text-decoration-thickness:3px;color:var(--pri);font-weight:900}
.big{font-size:2rem;text-align:center;font-weight:900;margin:10px 0}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:8px 14px;border:2px solid var(--ln);border-radius:20px;font-weight:700;cursor:pointer;background:var(--card);color:var(--ink);font-family:inherit}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.cert{border:6px double var(--acc);text-align:center;padding:24px;background:var(--card);border-radius:12px}.cert h2{font-size:1.8rem;margin:.2em}
.bd{display:inline-block;text-align:center;margin:6px;width:92px;font-size:.8rem}.bd span{display:block;font-size:2.2rem}.lock{filter:grayscale(1);opacity:.4}
#o.big{direction:ltr;unicode-bidi:isolate}u{background:#ffc93c55;border-radius:6px;padding:0 3px;text-decoration:none}.big bdi{unicode-bidi:isolate}
footer{text-align:center;color:var(--mut);font-weight:700;font-size:.85rem;padding:8px 0 80px}
@media print{header,nav,.np,footer{display:none}}
</style></head><body>

const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);

const NM=['','ألف','مليون','مليار','تريليون'];

const mc=(q,a,w,y)=>{let o=[a];w.forEach(x=>{if(!o.includes(x))o.push(x)});o=sh(o.slice(0,4));return{q,o,a:o.indexOf(a),y}};
const nd=a=>sh([a+1,a-1,a+10,a-10,a*2,a+100].filter(x=>x!==a&&x>=0));
const RULE={2:'آحاده ٠ أو ٢ أو ٤ أو ٦ أو ٨',3:'مجموع أرقامه يقبل القسمة على ٣',4:'رقما آحاده وعشراته يقبلان القسمة على ٤',5:'آحاده ٠ أو ٥',6:'يقبل القسمة على ٢ و٣ معًا',9:'مجموع أرقامه يقبل القسمة على ٩',10:'آحاده صفر'};

()=>{const L=R(7,11);let s=String(R(1,9));for(let i=1;i<L;i++)s+=R(0,9);let p=R(0,L-1);while(s[p]=='0')p=R(0,L-1);const v=+s[p]*10**(L-1-p);
const t=s.split('').map((c,i)=>(i==p?`<u>${c}</u>`:c)+((L-1-i)%3==0&&i<L-1?'<span class=sp></span>':'')).join('');
return mc(`ما القيمة المكانية للرقم المُلوَّن في العدد: <div class="big num" dir=ltr>${t}</div>`,sn(v),[sn(v*10),sn(v*100),v>=10?sn(v/10):sn(v*1000)],'القيمة المكانية = الرقم × قيمة منزلته.')},
()=>{const n=R(1200,98999),p=[10,100,1000][R(0,2)],a=Math.round(n/p)*p,nm={10:'عشرة',100:'مئة',1000:'ألف'}[p];
return mc(`قرّب ${n} إلى أقرب ${nm}`,a,[a+p,a-p,Math.floor(n/p)*p==a?Math.ceil(n/p)*p:Math.floor(n/p)*p],'انظر إلى الرقم على يمين المنزلة: ٥ أو أكثر نزيد، وإلا نبقي.')},
()=>{const a=R(2,9),b=R(2,9),c=R(2,9),t=R(0,2);
if(t==0)return mc(`${a} + ${b} × ${c} = ؟`,a+b*c,[(a+b)*c,...nd(a+b*c)],'الضرب قبل الجمع.');
if(t==1)return mc(`(${a} + ${b}) × ${c} = ؟`,(a+b)*c,[a+b*c,...nd((a+b)*c)],'ما بين القوسين أولًا.');
return mc(`${c} + ${a*b} ÷ ${b} = ؟`,c+a,[c+a*b,...nd(c+a)],'القسمة قبل الجمع.')},
()=>{const d=[2,3,4,5,6,9,10][R(0,6)],a=d*R(12,90),w=[];while(w.length<3){const x=a+R(1,99);if(x%d&&!w.includes(x))w.push(x)}

()=>{const t=R(0,2);

if(t==1){const a=R(25,155);return mc(`زاويتان متكاملتان، إحداهما ${a}°. قياس الأخرى؟`,180-a+'°',[90-a>0?90-a+'°':a+10+'°',a+'°',360-a+'°'],'الزاويتان المتكاملتان مجموعهما ١٨٠°.')}
const a=R(60,110),b=R(70,120),c=R(50,100),x=360-a-b-c;return mc(`شكل رباعي زواياه ${a}° و ${b}° و ${c}° والرابعة؟`,x+'°',[x+20+'°',180-a+'°',x-20+'°'],'مجموع زوايا الشكل الرباعي ٣٦٠°.')},
()=>{const t=R(0,3);

if(t==1){const n=R(1,4),d=R(n+1,7),k=R(2,5);return mc(`${fr(n,d)} = ${fr('؟',d*k)} فما العدد الناقص؟`,n*k+'',[n*k+1+'',n+k+'',n*k-1+''],'نضرب البسط والمقام في العدد نفسه.')}

()=>{const t=R(0,2);
